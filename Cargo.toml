[package]
name = "revo2"
version = "0.1.0"
edition = "2021"
description = "CUDA cellular evolution with image-program and rectangle-packing demos"
license = "MIT"

[features]
default = ["cuda"]
cuda = ["revo-core/cuda", "dep:cudarc"]

[workspace]
members = ["crates/revo-core"]
resolver = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
revo-core = { path = "crates/revo-core", default-features = false }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = "thin"
