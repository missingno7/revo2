[package]
name = "revo2"
version = "0.1.0"
edition = "2021"
description = "CUDA-first cellular evolution of image-generating programs"
license = "MIT"

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = "thin"
